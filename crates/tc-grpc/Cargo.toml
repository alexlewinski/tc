[package]
name = "tc-grpc"
description = "gRPC image generation service (tonic): server, client and protocol types."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
tc-service = { path = "../tc-service" }
tc-core = { path = "../tc-core" }
tc-config = { path = "../tc-config" }
tc-wire = { path = "../tc-wire" }
nnc = { path = "../nnc" }
tonic = { version = "0.12", features = ["tls", "gzip"] }
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "signal"] }
tokio-stream = "0.1"
futures = "0.3"
anyhow = "1"
log = "0.4"
sha2 = "0.10"
rand = "0.8"
rcgen = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde_json = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.4"

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
