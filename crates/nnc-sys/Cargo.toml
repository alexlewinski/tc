[package]
name = "nnc-sys"
description = "Raw FFI bindings to the vendored ccv / nnc library."
version.workspace = true
edition.workspace = true
license.workspace = true
links = "ccv"
build = "build.rs"

[build-dependencies]
flate2 = "1"
bindgen = { version = "0.71", optional = true }

[features]
# Regenerate src/bindings.rs with bindgen (requires libclang). The checked-in
# bindings are used otherwise.
regenerate-bindings = ["dep:bindgen"]
# Link against a system CBLAS (OpenBLAS) on Linux for faster CPU GEMM.
openblas = []
# Build the CUDA backend (Linux, requires nvcc and CUDA toolkit at CUDA_HOME or /usr/local/cuda).
cuda = []
